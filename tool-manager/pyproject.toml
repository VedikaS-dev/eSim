[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "esim-tool-manager"
version = "1.0.0"
description = "Policy-driven cross-platform lifecycle manager for the eSim external toolchain"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "eSim Tool Manager"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
esim-tool-manager = "esim_tool_manager.cli:main"

[tool.setuptools.package-data]
esim_tool_manager = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
